const q=document.getElementById('q'),out=document.getElementById('out'),meta=document.getElementById('meta');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const t=q.value.trim();
  if(!t){out.innerHTML='';meta.textContent='ทั้งหมด '+D.length+' หน่วยงาน (ส่วนกลาง '+D.filter(r=>r[0]==='ส').length+' · ส่วนภูมิภาค '+D.filter(r=>r[0]==='ภ').length+')';return}

  let m=idx.filter(x=>x.k.includes(a)||x.raw.includes(b));
  m.sort((x,y)=>(y.k.startsWith(a)|0)-(x.k.startsWith(a)|0));
  if(!m.length){out.innerHTML='<li class="empty" style="border:0;background:none">ไม่พบหน่วยงานที่ตรงกับ “'+esc(t)+'” ลองพิมพ์สั้นลง เช่น ชื่อจังหวัดอย่างเดียว</li>';meta.textContent='';return}

}
q.addEventListener('input',render);render();
